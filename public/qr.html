<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan to view menu</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet"
  >
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fbfaf7;
      font-family: 'Inter', sans-serif;
      color: #22211d;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p {
      color: #8a867a;
      font-size: 13px;
      margin-bottom: 28px;
    }

    #qrBox {
      background: #ffffff;
      border: 1px solid #e4e0d6;
      border-radius: 8px;
      padding: 20px;
    }

    #qrBox img {
      width: 260px;
      height: 260px;
      display: block;
    }

    #loading {
      color: #8a867a;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <h1>Scan for the menu</h1>
  <p>Point your camera and place any dish on your table</p>

  <div id="qrBox">
    <p id="loading">Generating...</p>
  </div>

  <script>
    async function loadQr() {
      try {
        const res = await fetch('/api/qr');
        const data = await res.json();

        const qrBox = document.getElementById('qrBox');
        qrBox.innerHTML = `<img src="${data.qrImage}" alt="QR code">`;
      } catch (err) {
        document.getElementById('loading').textContent = 'Failed to load QR code.';
        console.error(err);
      }
    }

    loadQr();
  </script>

</body>
</html>
